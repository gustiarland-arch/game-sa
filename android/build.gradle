plugins {
    id 'com.android.application'
}

// Konfigurasi signing hanya dari environment; jangan menyimpan keystore/password di repo.
def releaseStore = System.getenv('OLU_RELEASE_KEYSTORE')
def releaseAlias = System.getenv('OLU_RELEASE_ALIAS')
def releaseStorePass = System.getenv('OLU_RELEASE_STORE_PASSWORD')
def releaseKeyPass = System.getenv('OLU_RELEASE_KEY_PASSWORD')
def canSignRelease = [releaseStore, releaseAlias, releaseStorePass, releaseKeyPass].every { it != null && !it.isEmpty() }

android {
    namespace 'com.arlandsofia.olu'
    compileSdk 36

    defaultConfig {
        applicationId 'com.arlandsofia.olu'
        minSdk 21
        targetSdk 36
        versionCode rootProject.ext.appVersionCode
        versionName rootProject.ext.appVersionName
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src/main/java']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
            jniLibs.srcDirs = ['libs']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    signingConfigs {
        if (canSignRelease) {
            release {
                storeFile file(releaseStore)
                storePassword releaseStorePass
                keyAlias releaseAlias
                keyPassword releaseKeyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false // aman dahulu sampai proguard/r8 benar-benar diuji pada perangkat
            if (canSignRelease) signingConfig signingConfigs.release
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/robovm/ios/robovm.xml']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

configurations { natives }

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"
}

// Salin library native LibGDX (.so) ke android/libs sebelum dipaketkan ke APK.
tasks.register('copyAndroidNatives') {
    doFirst {
        ['armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'].each { file("libs/$it/").mkdirs() }
        configurations.natives.copy().files.each { jar ->
            def outputDir = null
            if (jar.name.endsWith('natives-armeabi-v7a.jar')) outputDir = file('libs/armeabi-v7a')
            if (jar.name.endsWith('natives-arm64-v8a.jar')) outputDir = file('libs/arm64-v8a')
            if (jar.name.endsWith('natives-x86_64.jar')) outputDir = file('libs/x86_64')
            if (jar.name.endsWith('natives-x86.jar')) outputDir = file('libs/x86')
            if (outputDir != null) {
                copy {
                    from zipTree(jar)
                    into outputDir
                    include '*.so'
                }
            }
        }
    }
}

tasks.matching { it.name.contains('merge') && it.name.contains('JniLibFolders') }.configureEach { packageTask ->
    packageTask.dependsOn 'copyAndroidNatives'
}
