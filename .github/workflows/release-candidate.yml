name: Release Candidate (signed AAB)
on:
  workflow_dispatch:

jobs:
  candidate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install API 36 and Build Tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify source and logic before signing
        run: |
          python3 -m pip install Pillow numpy
          bash tools/test_logic.sh
          bash tools/test_v30.sh
          bash tools/test_dialogue_ui_v30.sh
          bash tools/test_v30_ui_compile.sh
          python3 tools/test_native_16k_v30.py
          # v3.x pixel-hash goldens are archived, not valid for deliberately new v4 artwork.
          python3 tools/test_maps_v4.py
          python3 tools/test_maps_v41_remaining.py
          python3 tools/test_v42_world.py
          python3 tools/test_v43_world.py
          bash tools/test_tablet_v43.sh
          python3 tools/test_maps_v4_navigation.py
          bash tools/test_maps_v4_save.sh
          python3 tools/release_audit_v4.py
          bash tools/test_character_logic_v37.sh
          bash tools/test_controls_v28.sh
          bash tools/test_romance_ui.sh
          python3 tools/test_audio_v24.py android/assets/audio
          python3 tools/test_story_v26.py
          python3 tools/test_world_events_v27.py
      - name: Decode signing key from repository secret
        env:
          RELEASE_STORE_B64: ${{ secrets.OLU_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_STORE_B64" || { echo 'Set OLU_RELEASE_KEYSTORE_BASE64 GitHub secret first'; exit 1; }
          printf '%s' "$RELEASE_STORE_B64" | base64 -d > release-upload.jks
          test -s release-upload.jks
      - name: Build signed Android App Bundle
        env:
          OLU_RELEASE_KEYSTORE: ${{ github.workspace }}/release-upload.jks
          OLU_RELEASE_ALIAS: ${{ secrets.OLU_RELEASE_ALIAS }}
          OLU_RELEASE_STORE_PASSWORD: ${{ secrets.OLU_RELEASE_STORE_PASSWORD }}
          OLU_RELEASE_KEY_PASSWORD: ${{ secrets.OLU_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$OLU_RELEASE_ALIAS" && test -n "$OLU_RELEASE_STORE_PASSWORD" && test -n "$OLU_RELEASE_KEY_PASSWORD"
          chmod +x gradlew
          ./gradlew :core:test :android:assembleRelease :android:bundleRelease --stacktrace
      - name: Verify signed APK and no network permissions
        run: |
          APK=android/build/outputs/apk/release/android-release.apk
          BUNDLE=android/build/outputs/bundle/release/android-release.aab
          test -s "$APK" && test -s "$BUNDLE"
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose "$APK"
          ZIPALIGN=$(ls "$ANDROID_HOME"/build-tools/*/zipalign | sort -V | tail -1)
          "$ZIPALIGN" -c -P 16 -v 4 "$APK"
          python3 tools/verify_native_16k_v30.py "$APK"
          "$AAPT2" dump permissions "$APK" | tee merged_permissions.txt
          if grep -Ei 'android.permission.(INTERNET|ACCESS_NETWORK_STATE|ACCESS_WIFI_STATE)' merged_permissions.txt; then
            echo 'RELEASE BLOCKED: network permissions present in APK'; exit 1
          fi
          sha256sum "$APK" > "${APK}.sha256"
          sha256sum "$BUNDLE" > "${BUNDLE}.sha256"
          echo 'Required before Play submission: 16 KB native ELF alignment, device test, store compliance review.'
      - uses: actions/upload-artifact@v4
        with:
          name: ArlandSofia-v4.3-signed-AAB-candidate
          path: |
            android/build/outputs/bundle/release/*.aab
            android/build/outputs/bundle/release/*.sha256
            android/build/outputs/apk/release/*.apk
            android/build/outputs/apk/release/*.sha256
          if-no-files-found: error
      - name: Cleanup keystore
        if: always()
        run: rm -f release-upload.jks
