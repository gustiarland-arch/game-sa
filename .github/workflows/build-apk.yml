name: Build APK debug (offline game)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (API 36)
        uses: android-actions/setup-android@v3
        with:
          # Default package list includes the removed 'tools' package and fails.
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Uji logika cerita, quest, save (kedua route)
        run: |
          chmod +x gradlew
          ./gradlew :core:test --stacktrace

      - name: Pastikan ffprobe tersedia untuk validasi audio
        run: |
          command -v ffprobe || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Validasi aset visual, aksi berdua dan UI input
        run: |
          python3 -m pip install Pillow numpy
          # Archived v2.4-v4.4 gates are kept in tools/ but not run: they assert historic
          # counts (22 maps, 40 music tracks, 14 events, old prop counts) that later releases
          # intentionally changed, and they already failed on v5.3 main. The v5.x gates
          # (test_v54_release.sh -> v5.3/v5.2/v5.1/v5.0) cover current content.
          bash tools/test_logic.sh
          bash tools/test_romance_ui.sh
          python3 tools/test_couple_v22.py
          python3 tools/test_visual_v21.py android/assets
          # v2.3 pixel snapshot test archived after v4 custom world art
          bash tools/test_audio_manager.sh
          bash tools/test_settings_ui_v24.sh
          bash tools/test_controls_v28.sh
          bash tools/test_visual_fx.sh
          python3 tools/test_story_v26.py
          bash tools/test_v30.sh
          bash tools/test_dialogue_ui_v30.sh
          bash tools/test_v30_ui_compile.sh
          python3 tools/test_native_16k_v30.py
          # v3.x pixel-hash goldens are archived, not valid for deliberately new v4 artwork.
          bash tools/test_tablet_v43.sh
          bash tools/test_tablet_v44.sh
          python3 tools/test_maps_v4_navigation.py
          bash tools/test_maps_v4_save.sh
          python3 tools/release_audit_v4.py
          bash tools/test_character_logic_v37.sh
          bash tools/test_v54_release.sh

      - name: Build APK debug
        run: ./gradlew :android:assembleDebug --stacktrace

      - name: Pastikan TIDAK ada izin internet di APK
        run: |
          APK=android/build/outputs/apk/debug/android-debug.apk
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump permissions "$APK" | tee permissions.txt
          if grep -Ei "android.permission.(INTERNET|ACCESS_NETWORK_STATE)" permissions.txt; then
            echo "GAGAL: APK meminta izin jaringan"; exit 1
          fi
          echo "OK: tidak ada izin jaringan"

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: ArlandSofia-v5.4-debug-apk
          path: android/build/outputs/apk/debug/*.apk
