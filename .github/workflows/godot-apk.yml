name: Godot APK (debug)

on:
  push:
    branches: [ feature/godot-port ]
    paths: [ 'godot/**', 'android/assets/**', '.github/workflows/godot-apk.yml' ]
  pull_request:
    paths: [ 'godot/**', 'android/assets/**', '.github/workflows/godot-apk.yml' ]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.3
  GODOT_RELEASE: stable

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Godot + export templates
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q godot.zip && mv Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64 /usr/local/bin/godot
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}
          mkdir -p "$dest" && unzip -q templates.tpz -d /tmp/tpl && mv /tmp/tpl/templates/* "$dest/"
          rm -f godot.zip templates.tpz

      - name: Debug keystore + editor settings
        run: |
          keytool -genkeypair -v -keystore ~/debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${GODOT_VERSION}.tres <<TRES
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          TRES

      - name: Import project
        run: godot --headless --path godot --import || true

      - name: Logic tests (both routes, saves, quests, minigames)
        run: |
          timeout 300 godot --headless --path godot tests/logic_test.tscn 2>&1 | tee test.log
          grep -q "SEMUA LULUS" test.log

      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --path godot --export-debug "Android" ../build/arland-sofia-godot.apk 2>&1 | tee export.log
          test -s build/arland-sofia-godot.apk
          ls -lh build/

      - name: No internet permission in the APK
        run: |
          AAPT=$(ls ${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/*/aapt | tail -1)
          if $AAPT dump permissions build/arland-sofia-godot.apk | grep -q android.permission.INTERNET; then
            echo "APK requests INTERNET"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: arland-sofia-godot-debug-apk
          path: build/arland-sofia-godot.apk
